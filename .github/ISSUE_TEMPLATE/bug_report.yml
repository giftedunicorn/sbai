name: Bug report
description: Report a reproducible problem without sharing private transcript data.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: Thanks for reporting a bug. Please redact all private agent and filesystem data.
  - type: input
    id: version
    attributes:
      label: Version or commit
      description: Release name or commit SHA where the problem occurs.
      placeholder: v0.1.0 or b489541
    validations:
      required: true
  - type: dropdown
    id: operating-system
    attributes:
      label: Operating system
      options:
        - macOS
        - Windows
        - Linux
        - Web demo
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: v24.x
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps
      description: Use synthetic session names, paths, commands, and transcript content.
      placeholder: |
        1. Start the app with ...
        2. Select a synthetic transcript directory ...
        3. Observe ...
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: textarea
    id: diagnostics
    attributes:
      label: Sanitized diagnostics
      description: Optional. Never paste real transcripts, paths, commands, credentials, or personal data.
      render: shell
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy check
      options:
        - label: I removed transcript text, file paths, commands, credentials, and other private data.
          required: true
  - type: checkboxes
    id: search
    attributes:
      label: Existing reports
      options:
        - label: I searched existing issues for the same problem.
          required: true
